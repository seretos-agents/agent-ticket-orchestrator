name: release

# Manual release flow:
#   1. Trigger via Actions tab -> "Run workflow" -> enter version (e.g. 0.0.1)
#      or via CLI: gh workflow run release.yml -f version=0.0.1
#   2. Workflow stamps version into plugin.json (in CI only), pushes an orphan
#      release branch with install-ready files (skills/, agents/, manifests), creates the
#      agent-ticket-orchestrator--v{version} tag on that commit, and publishes a
#      GitHub Release with the zip attached.
#   3. The workflow then notifies agent-marketplace directly via
#      MARKETPLACE_DISPATCH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pre-flight: validates the version, resolves this release's tag and
      # the previous release's tag, and proves both src/* note-generation
      # markers are in the state this scheme needs -- all before any side
      # effect (no manifest stamp, no zip, no push, no tag, no dispatch).
      # Absorbs the former standalone "Validate version is semver" step
      # (the semver grammar now lives once, in prev-release-tag.sh's
      # --validate mode, shared with the ordering logic below) and the
      # former "Fail if tag already exists" step. Every read here
      # (`git/ref/tags/*`, GitHub's singular "Get a reference" endpoint --
      # the plural `git/refs/tags/...` is not a valid single-ref lookup and
      # 404s unconditionally) is a GITHUB_TOKEN-scoped lookup on this repo's
      # own refs -- `contents: write` already covers it, and a 404 is an
      # expected, handled outcome, not an error.
      - name: Pre-flight
        id: pre
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "${{ github.ref_name }}" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Release must be run from the default branch ($DEFAULT_BRANCH), not ${{ github.ref_name }}. Re-run workflow_dispatch from $DEFAULT_BRANCH."
            exit 1
          fi

          V="${{ inputs.version }}"
          if ! bash .github/scripts/prev-release-tag.sh --validate "$V"; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${V}"
          MAIN_SHA=$(git rev-parse HEAD)

          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

          if gh api "repos/${{ github.repository }}/git/ref/tags/src/${TAG}" >/dev/null 2>&1; then
            echo "::error::Marker tag src/${TAG} already exists. Versions are immutable -- a marker is never deleted or moved, so this should not happen; investigate before retrying."
            exit 1
          fi

          PREV_TAG=$(git tag -l | bash .github/scripts/prev-release-tag.sh "$TAG")

          if [ -n "$PREV_TAG" ]; then
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/src/${PREV_TAG}" >/dev/null 2>&1; then
              echo "::error::Marker tag src/${PREV_TAG} does not exist, so release notes cannot be generated from main. One-time human bootstrap needed -- run:"
              echo "::error::  git tag src/${PREV_TAG} <head_sha of ${PREV_TAG}'s release.yml run>"
              echo "::error::  git push origin src/${PREV_TAG}"
              exit 1
            fi
          fi

          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Stamp version into plugin manifests (in CI only)
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"

      - name: Stage install tree and build release zip
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-ticket-orchestrator"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/.codex-plugin" "$STAGE/skills" "$STAGE/agents"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp .codex-plugin/plugin.json  "$STAGE/.codex-plugin/"
          cp -a skills/. "$STAGE/skills/"
          # agents/ is a release artifact: the skills dispatch these subagent types.
          cp -a agents/. "$STAGE/agents/"
          # scripts/ is a release artifact: the run skill calls start-package-session.sh via ${CLAUDE_PLUGIN_ROOT}.
          mkdir -p "$STAGE/scripts" && cp -a scripts/. "$STAGE/scripts/"
          # templates/ is a release artifact: the GitHub issue forms a project
          # adopts via "## Adopting the forms in a project" (README.md) ship
          # from here. Always exists in this repo, so copied unconditionally
          # like agents/ and scripts/ above.
          mkdir -p "$STAGE/templates" && cp -a templates/. "$STAGE/templates/"
          # hooks/ is a release artifact: hooks/hooks.json's PreToolUse entry
          # is what mechanically blocks worktree_remove on unsalvaged pkg/*
          # work (#84) -- without it, a client only gets the guard script,
          # never wired up to fire.
          mkdir -p "$STAGE/hooks" && cp -a hooks/. "$STAGE/hooks/"
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          # assets/ goes onto the orphan release branch so the dispatch
          # payload's icon URL (raw.githubusercontent.com/${repo}/${TAG}/
          # assets/icon.png) resolves.
          [ -d assets ] && cp -a assets "$STAGE/" || true
          # description.md ships onto the orphan release branch so the dispatch
          # payload's description_url resolves at the tagged commit.
          [ -f description.md ] && cp -a description.md "$STAGE/" || true

          mkdir -p dist
          ZIPNAME="agent-ticket-orchestrator-${{ inputs.version }}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/$ZIPNAME" .)

          echo "stage=$STAGE"      >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

      # Marks the `main` commit this release was cut from. Pushed
      # unconditionally -- pre-flight already proved src/$TAG's absence, so
      # a "skip if exists" guard here would only ever hide a bug (and once
      # did: a guard on this same tag re-empties the notes on a retried run
      # by keeping a stale marker from a failed attempt, agent-comfy PR
      # #55). A failed push here must fail the whole run. Placed after the
      # build succeeds and before the orphan push, so a build failure never
      # leaves a marker behind for a release that didn't happen.
      - name: Push source tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pre.outputs.tag }}"
          MAIN_SHA="${{ steps.pre.outputs.main_sha }}"
          git tag "src/${TAG}" "$MAIN_SHA"
          git push origin "refs/tags/src/${TAG}"

      # `gh release create --generate-notes` / `--notes-start-tag` cannot be
      # used here: the orphan `release` tag/branch shares no history with
      # `main` or any previous release tag (that parentlessness is this
      # ticket's root cause), so GitHub's commit-graph walk for notes finds
      # nothing. Generate them instead between the src/* markers, which DO
      # live on `main` and therefore have real history to diff.
      - name: Generate release notes from main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pre.outputs.tag }}"
          MAIN_SHA="${{ steps.pre.outputs.main_sha }}"
          PREV_TAG="${{ steps.pre.outputs.prev_tag }}"

          if [ -n "$PREV_TAG" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="src/${TAG}" \
              -f target_commitish="$MAIN_SHA" \
              -f previous_tag_name="src/${PREV_TAG}" \
              --jq .body > "$RUNNER_TEMP/notes.md"
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="src/${TAG}" \
              -f target_commitish="$MAIN_SHA" \
              --jq .body > "$RUNNER_TEMP/notes.md"
          fi

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.zip }}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::staging dir $STAGE not produced"; exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::release zip $ZIP not produced"
            ls -la dist/ || true
            exit 1
          fi

          # Stash staging tree AND the release zip outside the worktree, since
          # "git checkout --orphan" + clean will wipe dist/ before we attach
          # the zip to the GitHub Release.
          TMP=$(mktemp -d)
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          # The dispatch step below runs after this step has replaced the
          # worktree with the orphan tree, which has no .github/ at all --
          # stash a copy of the scripts it needs outside the worktree first,
          # same pattern as $TMP (stage tree) and $ASSET_DIR (zip) above.
          SCRIPTS_DIR=$(mktemp -d)
          cp -a .github/scripts/. "$SCRIPTS_DIR/"
          echo "scripts=$SCRIPTS_DIR" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pre.outputs.tag }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          VERSION:  ${{ inputs.version }}
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          TAG="${{ steps.pre.outputs.tag }}"

          # Same notes already generated for the GitHub Release two steps
          # above -- read them back rather than recomputing, so the two can
          # never drift apart. `&& printf x` + the trailing `%$'\n'` strip
          # removes exactly the one newline `--jq .body` itself appends,
          # without losing a trailing newline the changelog body may end
          # with of its own accord (a bare `$(...)` strips ALL trailing
          # newlines, which this sentinel avoids); `&&` is needed because
          # `errexit` does not propagate out of a `$(...)` on its own.
          CHANGELOG=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body && printf x); CHANGELOG="${CHANGELOG%x}"; CHANGELOG="${CHANGELOG%$'\n'}"

          # Built by .github/scripts/marketplace-payload.sh with a single
          # jq -n invocation, not spliced into an unquoted heredoc: the
          # changelog is multi-line markdown that can contain backticks,
          # quotes and newlines, any of which would break the old
          # `curl -d @- <<EOF` pattern and silently drop the whole dispatch
          # (agent-marketplace#235's contract note; the same thing already
          # happened once with `tags`, see agent-marketplace@89aa850). The
          # script lives under .github/scripts, which no longer exists in
          # this step's working tree (the previous step replaced it with
          # the orphan tree) -- steps.rel.outputs.scripts is where it was
          # copied to before that happened.
          PAYLOAD=$(NAME="$NAME" DESC="$DESC" REPO="${{ github.repository }}" VERSION="$VERSION" TAG="$TAG" CHANGELOG="$CHANGELOG" bash "${{ steps.rel.outputs.scripts }}/marketplace-payload.sh")

          # Staging first (lands straight to main, no review), then the
          # curated marketplace (opens a review PR) -- same payload, two
          # independent dispatches.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory-staging/dispatches \
            -d "$PAYLOAD"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory/dispatches \
            -d "$PAYLOAD"
